version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nazeerdfs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nazeerdfs
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  nazeerdfs-cluster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nazeerdfs-node
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "3000:3000"
      - "4000:4000"
      - "5000:5000"
    environment:
      - HTTP_PORT=8080
      - SECRET_KEY=nazeerdfs_production_secret_key_2026
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=nazeerdfs
    volumes:
      - node3000_data:/app/3000_network
      - node4000_data:/app/4000_network
      - node5000_data:/app/5000_network
    restart: unless-stopped

volumes:
  mysql_data:
  node3000_data:
  node4000_data:
  node5000_data:
