version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nazeerdfs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nazeerdfs
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  nazeerdfs-cluster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nazeerdfs-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "3000:3000"
      - "4000:4000"
      - "5000:5000"
    environment:
      - APP_ENV=production
      - HTTP_PORT=8080
      - CLUSTER_SECRET=nazeerdfs_production_cluster_secret_key_2026
      - ENCRYPTION_KEY=5v8y/B?E(H+MbQeThWmZq4t7w!z%C*F)J@NcRfUjXn2r5u8x/A?D(G+KbPdSgVkY
      - ADMIN_BOOTSTRAP_PASSWORD=AdminProductionPassword2026!
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=nazeerdfs
    volumes:
      - cluster_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  cluster_data:
